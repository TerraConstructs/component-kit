# release-please opens/updates the release PR; merging it tags each changed package and
# publishes to npm with trusted publishing (OIDC). No NPM_TOKEN: each package's npm trusted
# publisher is bound to TerraConstructs/component-kit + this file name (release.yml).
name: release

on:
  push:
    branches: [main]
  # Manual publish for a release whose release-please run already happened
  # (release_created is only true once). pnpm skips versions already on npm.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # Two pushes landing together (e.g. a release PR merge right after another commit) must not
    # race: both runs try to create the same GitHub releases. Queue them; never cancel mid-run.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # The org forbids GITHUB_TOKEN from creating pull requests. The tcons-release-bot app
      # token is a separate identity, and its release PR also triggers the ci checks.
      - name: Mint tcons-release-bot token
        id: app-token
        if: ${{ github.event_name == 'push' }}
        uses: actions/create-github-app-token@v3.4.0 # client-id input (app-id deprecated)
        with:
          client-id: ${{ vars.TCONS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TCONS_RELEASE_BOT_PRIVATE_KEY }}
      - id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build test
      - name: Publish (OIDC trusted publishing)
        run: pnpm run ci:publish
